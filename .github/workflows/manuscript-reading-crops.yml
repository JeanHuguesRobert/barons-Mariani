name: Manuscript — reading crops (artifact only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manuscript-reading-crops.yml'
      - 'scripts/prepare-manuscript-reading.py'
      - 'scripts/test-prepare-manuscript-reading.py'
      - 'scripts/ocr-manuscript-diagnostic.py'
      - 'scripts/build-scan-judgment-packet.py'
  workflow_dispatch:
    inputs:
      image:
        description: "Image basename in the 1755 archival JPEG folder (e.g. FRAD02A_0002.jpg)"
        required: true
        default: "FRAD02A_0002.jpg"
        type: string
      bands:
        description: "Number of horizontal strips"
        required: true
        default: "4"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded input
        env:
          IMAGE: ${{ inputs.image || 'FRAD02A_0002.jpg' }}
          BANDS: ${{ inputs.bands || '4' }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'FRAD02A_[0-9]{4}\.jpg', os.environ['IMAGE']), 'Invalid image name'
          assert os.environ['BANDS'].isdigit() and 1 <= int(os.environ['BANDS']) <= 20, 'Invalid band count'
          PY
      - name: Install image dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Test crop processor on synthetic image
        run: python scripts/test-prepare-manuscript-reading.py
      - name: Prepare reading crops
        env:
          IMAGE: ${{ inputs.image || 'FRAD02A_0002.jpg' }}
          BANDS: ${{ inputs.bands || '4' }}
        run: |
          python scripts/prepare-manuscript-reading.py \
            "projects/1755/sources/constitution-1755-manuscrit/images/$IMAGE" \
            --output "build/manuscript-reading/${IMAGE%.jpg}" \
            --bands "$BANDS"
      - name: Install OCR diagnostic engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ita tesseract-ocr-fra
      - name: OCR diagnostic (unreviewed, original JPEG)
        env:
          IMAGE: ${{ inputs.image || 'FRAD02A_0002.jpg' }}
        run: |
          python scripts/ocr-manuscript-diagnostic.py \
            "projects/1755/sources/constitution-1755-manuscrit/images/$IMAGE" \
            --output "build/manuscript-reading/${IMAGE%.jpg}"
      - name: Materialize resumable judgment continuation
        env:
          IMAGE: ${{ inputs.image || 'FRAD02A_0002.jpg' }}
        run: |
          python scripts/build-scan-judgment-packet.py \
            --manifest "build/manuscript-reading/${IMAGE%.jpg}/manifest.json" \
            --diagnostic "build/manuscript-reading/${IMAGE%.jpg}/ocr-provenance.json" \
            --ocr "build/manuscript-reading/${IMAGE%.jpg}/ocr-candidate.txt" \
            --image-ref "projects/1755/sources/constitution-1755-manuscrit/images/$IMAGE" \
            --output "build/manuscript-reading/${IMAGE%.jpg}/judgment-continuation.json"
      - name: Checkout existing Cogentia runtime (no forked dispatcher)
        uses: actions/checkout@v4
        with:
          repository: JeanHuguesRobert/cogentia
          path: .runtime/cogentia
          persist-credentials: false
      - name: Install Cogentia dependencies
        run: |
          corepack enable
          cd .runtime/cogentia
          corepack pnpm install --frozen-lockfile
      - name: Emit native Cogentia continuation (portable receipt)
        env:
          IMAGE: ${{ inputs.image || 'FRAD02A_0002.jpg' }}
        run: |
          set -eu
          mkdir -p build/scan-registry
          printf '{"repos":[{"name":"barons-Mariani","path":"../.."}]}\n' > build/scan-registry/.cogentia.json
          OUT="build/manuscript-reading/${IMAGE%.jpg}"
          COGENTIA_REGISTRY="$PWD/build/scan-registry/.cogentia.json" \
          node .runtime/cogentia/scripts/cogentia.js \
            continuation emit --kind judgment \
            --title "Paleographic review $IMAGE" \
            --repo barons-Mariani \
            --path "projects/1755/sources/constitution-1755-manuscrit/images/$IMAGE" \
            --required-capabilities "image_view,paleographic_judgment" \
            --dedupe-key "scan-review:$IMAGE" \
            --question "Review image evidence; never approve machine OCR without direct visual verification." \
            --context-file "$OUT/judgment-continuation.json"
          mkdir -p "$OUT/native-cogentia"
          cp build/scan-registry/.cogentia/continuations/*.json "$OUT/native-cogentia/"
          test -n "$(find "$OUT/native-cogentia" -name 'ctn_*.json' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-reading-${{ github.run_number }}
          path: build/manuscript-reading/
          if-no-files-found: error
          retention-days: 30

# Read-only pipeline: no commit or public text promotion. Native continuation is artifact-only; not dispatched to an external handler.
