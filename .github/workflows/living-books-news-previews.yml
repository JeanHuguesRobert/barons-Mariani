name: Living Books — public working editions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/autonomia/**"
      - "research/autonomia.md"
      - "research/methode_terrains_feconds.md"
      - "research/noyau_doctrinal_rendre_capable.md"
      - "projects/capable/manuscript/**"
      - "projects/capable/editions/**"
      - "projects/suicide-corse/manuscript/**"
      - "projects/suicide-corse/editions/**"
      - "projects/1755/manuscript/**"
      - "projects/1755/editions/**"
      - "projects/rise-and-fall/issues/2026-10-26-revolutions-lumineuses/**"
      - "scripts/build-living-books-news-previews.py"
      - ".github/workflows/living-books-news-previews.yml"

permissions:
  contents: write

concurrency:
  group: living-books-public-working
  cancel-in-progress: true

jobs:
  publish-working:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          persist-credentials: true
      - name: Execute publication with durable typed receipt
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          mkdir -p .living-books-diagnostics
          phase=checkout
          code=CHECKOUT_FAILED
          result=failed
          if [ "$CHECKOUT_OUTCOME" = success ]; then
            phase=render
            code=RENDER_FAILED
            python3 scripts/build-living-books-news-previews.py >.living-books-diagnostics/render.log 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              phase=validate
              code=VALIDATION_FAILED
              (
                set -e
                for name in index capable 1755 rise-and-fall suicide-corse; do
                  test -s "previews/en-preparation/$name.html"
                done
                python3 -m json.tool previews/en-preparation/manifest.json >/dev/null
              ) >.living-books-diagnostics/validate.log 2>&1
              rc=$?
              if [ "$rc" -eq 0 ]; then
                phase=publish
                code=PUBLISH_FAILED
                (
                  set -e
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add previews/en-preparation/
                  if git diff --cached --quiet; then
                    echo "Working pages already current"
                  else
                    git commit -m "build(living-books): refresh public working previews [skip ci]"
                    git push origin HEAD:main
                  fi
                ) >.living-books-diagnostics/publish.log 2>&1
                rc=$?
                if [ "$rc" -eq 0 ]; then
                  result=success
                  code=OK
                fi
              fi
            fi
          fi
          export PHASE="$phase" RESULT="$result" ERROR_CODE="$code"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "schema": "living-books.compute-receipt/v1",
              "outcome": os.environ["RESULT"],
              "phase": os.environ["PHASE"],
              "error_code": os.environ["ERROR_CODE"],
              "run_id": os.environ["RUN_ID"],
              "source_sha": os.environ["SOURCE_SHA"],
              "diagnostics": ["render.log", "validate.log", "publish.log"],
          }
          path = Path(".living-books-diagnostics/receipt.json")
          path.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt))
          PY
          if [ "$result" != success ]; then
            echo "::warning title=Living Books task failed::Phase $phase; code $code; inspect receipt artifact and logs"
          fi
          exit 0
      - name: Archive receipt and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-books-public-working-${{ github.run_number }}
          path: |
            .living-books-diagnostics/
            previews/en-preparation/
          if-no-files-found: warn
          retention-days: 30

# Publishing these PUBLIC WORKING previews is not freezing an edition.
# Do not modify any projects/*/projections or frozen site/book assets.
