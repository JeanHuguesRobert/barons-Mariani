name: Living Books — public working editions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/autonomia/**"
      - "research/autonomia.md"
      - "research/methode_terrains_feconds.md"
      - "research/noyau_doctrinal_rendre_capable.md"
      - "projects/capable/manuscript/**"
      - "projects/capable/editions/**"
      - "projects/capable/doctrine/**"
      - "projects/capable/magazine/**"
      - "projects/capable/annexes/**"
      - "projects/suicide-corse/manuscript/**"
      - "projects/suicide-corse/editions/**"
      - "projects/1755/manuscript/**"
      - "projects/1755/editions/**"
      - "projects/rise-and-fall/issues/2026-10-26-revolutions-lumineuses/**"
      - "scripts/build-living-books-news-previews.py"
      - "scripts/build-living-books-working-formats.py"
      - "scripts/ops/deploy-capable-working.py"
      - "scripts/ops/capable-deploy-trigger.sh"
      - "scripts/ops/check-deploy-capable-working.py"
      - ".github/workflows/living-books-news-previews.yml"

permissions:
  contents: write

concurrency:
  group: living-books-public-working
  # Let an active publication finish before another run checks out main.
  cancel-in-progress: false

jobs:
  publish-working:
    outputs:
      outcome: ${{ steps.publication.outputs.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          # A manual dispatch from a review branch is validation-only below.
          persist-credentials: true
      - name: Execute publication with durable typed receipt
        id: publication
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          set +e
          mkdir -p living-books-diagnostics
          : >living-books-diagnostics/source.log
          : >living-books-diagnostics/render.log
          : >living-books-diagnostics/validate.log
          : >living-books-diagnostics/publish.log
          phase=checkout
          code=CHECKOUT_FAILED
          result=failed
          publication=not_attempted
          source_sha="$SOURCE_SHA"
          if [ "$CHECKOUT_OUTCOME" = success ]; then
            source_sha=$(git rev-parse HEAD 2>living-books-diagnostics/source.log)
            phase=render
            code=RENDER_FAILED
            python3 scripts/build-living-books-news-previews.py >living-books-diagnostics/render.log 2>&1 && \
              python3 scripts/build-living-books-working-formats.py >>living-books-diagnostics/render.log 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              phase=validate
              code=VALIDATION_FAILED
              (
                set -e
                for name in index capable 1755 rise-and-fall suicide-corse; do
                  test -s "previews/en-preparation/$name.html"
                done
                test -s previews/en-preparation/capable.pdf
                test -s previews/en-preparation/capable.epub
                python3 -m json.tool previews/en-preparation/capable-formats.json >/dev/null
                python3 -m json.tool previews/en-preparation/manifest.json >/dev/null
              ) >living-books-diagnostics/validate.log 2>&1
              rc=$?
              if [ "$rc" -eq 0 ]; then
                if [ "$REF_NAME" = "refs/heads/main" ]; then
                  phase=publish
                  code=PUBLISH_FAILED
                  attempt=1
                  while [ "$attempt" -le 3 ]; do
                    if [ "$attempt" -gt 1 ]; then
                      phase=refresh
                      code=REFRESH_FAILED
                      (
                        echo "Retry $attempt: refresh from origin/main after rejected push"
                        git fetch origin main || exit $?
                        git reset --hard origin/main || exit $?
                      ) >>living-books-diagnostics/publish.log 2>&1
                      rc=$?
                      if [ "$rc" -ne 0 ]; then
                        break
                      fi
                      source_sha=$(git rev-parse HEAD 2>>living-books-diagnostics/source.log)
                      phase=render
                      code=RENDER_FAILED
                      python3 scripts/build-living-books-news-previews.py >living-books-diagnostics/render.log 2>&1 && \
              python3 scripts/build-living-books-working-formats.py >>living-books-diagnostics/render.log 2>&1
                      rc=$?
                      if [ "$rc" -ne 0 ]; then
                        break
                      fi
                      phase=validate
                      code=VALIDATION_FAILED
                      (
                        set -e
                        for name in index capable 1755 rise-and-fall suicide-corse; do
                          test -s "previews/en-preparation/$name.html"
                        done
                        test -s previews/en-preparation/capable.pdf
                test -s previews/en-preparation/capable.epub
                python3 -m json.tool previews/en-preparation/capable-formats.json >/dev/null
                python3 -m json.tool previews/en-preparation/manifest.json >/dev/null
                      ) >living-books-diagnostics/validate.log 2>&1
                      rc=$?
                      if [ "$rc" -ne 0 ]; then
                        break
                      fi
                      phase=publish
                      code=PUBLISH_FAILED
                    fi
                    (
                      set -e
                      git config user.name 'github-actions[bot]'
                      git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                      git add previews/en-preparation/
                      if git diff --cached --quiet; then
                        echo "Working pages already current"
                      else
                        git commit -m "build(living-books): refresh public working previews [skip ci]"
                        git push origin HEAD:main
                      fi
                    ) >>living-books-diagnostics/publish.log 2>&1
                    rc=$?
                    if [ "$rc" -eq 0 ]; then
                      if grep -q "Working pages already current" living-books-diagnostics/publish.log; then
                        publication=unchanged
                      else
                        publication=updated
                      fi
                      result=success
                      code=OK
                      phase=complete
                      break
                    fi
                    attempt=$((attempt + 1))
                  done
                else
                  # Review-branch dispatches verify the build without writing to main.
                  echo "Publication skipped for non-main ref: $REF_NAME" >living-books-diagnostics/publish.log
                  publication=skipped_non_main_ref
                  result=success
                  code=NOT_PUBLISHED
                  phase=complete
                fi
              fi
            fi
          fi
          export PHASE="$phase" RESULT="$result" ERROR_CODE="$code" SOURCE_SHA="$source_sha" PUBLICATION="$publication"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "schema": "living-books.compute-receipt/v1",
              "outcome": os.environ["RESULT"],
              "phase": os.environ["PHASE"],
              "error_code": os.environ["ERROR_CODE"],
              "publication": os.environ["PUBLICATION"],
              "run_id": os.environ["RUN_ID"],
              "source_sha": os.environ["SOURCE_SHA"],
              "diagnostics": ["source.log", "render.log", "validate.log", "publish.log"],
          }
          path = Path("living-books-diagnostics/receipt.json")
          path.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt))
          PY
          echo "outcome=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" != success ]; then
            echo "::warning title=Living Books task failed::Phase $phase; code $code; inspect receipt artifact and logs"
          fi
          exit 0
      - name: Archive receipt and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-books-public-working-${{ github.run_number }}
          path: |
            living-books-diagnostics/
            previews/en-preparation/
          if-no-files-found: warn
          retention-days: 30

  validate-capable-canonical-deployer:
    needs: [publish-working]
    if: ${{ github.ref == 'refs/heads/main' && needs.publish-working.outputs.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Nonprivileged atomic-release and frozen-book preservation test
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 scripts/ops/check-deploy-capable-working.py

  deploy-capable-canonical:
    # Existing preview publication is always public on GitHub Pages.
    # Canonical Fracta2 deployment is enabled once, after the owner configures
    # a scoped SSH identity and a root-owned fixed-purpose deploy command.
    needs: [publish-working, validate-capable-canonical-deployer]
    if: ${{ github.ref == 'refs/heads/main' && needs.publish-working.outputs.outcome == 'success' && needs.validate-capable-canonical-deployer.result == 'success' && vars.CAPABLE_CANONICAL_AUTODEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Deploy the working candidate to the canonical HTTPS site
        env:
          DEPLOY_HOST: ${{ vars.CAPABLE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.CAPABLE_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.CAPABLE_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CAPABLE_DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          # The deployment key has an SSH forced command, installed by the
          # site's owner. The runner cannot request an arbitrary host command.
          # The trigger fetches origin/main and calls one root-owned deployer.
          ssh -i "$keyfile" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            > canonical-deploy-receipt.json
          python3 - <<'PY2'
          import json
          from pathlib import Path
          r=json.loads(Path('canonical-deploy-receipt.json').read_text())
          assert r['outcome']=='DEPLOYED_VERIFIED'
          assert r['status']=='working-non-frozen'
          assert r['input_count']>=20
          print('CANONICAL_DEPLOY_RECEIPT',r['revision'],r['release'])
          PY2
          curl --fail --show-error --silent --retry 4 --retry-delay 2 \
            https://capable.acorsica.org/candidate-deploy.json \
            > public-candidate-deploy.json
          python3 - <<'PY2'
          import json
          from pathlib import Path
          deployed=json.loads(Path('canonical-deploy-receipt.json').read_text())
          public=json.loads(Path('public-candidate-deploy.json').read_text())
          assert deployed['source_sha256']==public['source_sha256']
          assert deployed['release']==public['release']
          print('CANONICAL_HTTP_RECEIPT_VERIFIED',public['release'])
          PY2
          for ext in html pdf epub; do
            curl --fail --show-error --silent --output /dev/null \
              "https://capable.acorsica.org/candidate.$ext"
          done
          curl --fail --show-error --silent \
            https://capable.acorsica.org/en-preparation.html | grep -q candidate.html
          echo "CANONICAL_WORKING_EDITION_PUBLISHED"
      - name: Archive canonical deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capable-canonical-deployment-${{ github.run_number }}
          path: |
            canonical-deploy-receipt.json
            public-candidate-deploy.json
          if-no-files-found: ignore
          retention-days: 30

# Publishing these PUBLIC WORKING previews is not freezing an edition.
# Do not modify any projects/*/projections or frozen site/book assets.
