name: Conseil constitutionnel petition REVIEW PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/senatoriales-2026/requete-conseil-constitutionnel.md"

permissions:
  contents: write
  issues: write

concurrency:
  group: cc-petition-review-pdf
  cancel-in-progress: true

env:
  CANONICAL_RELEASE_TAG: senatoriales-2026-cc-depot-2026-10-07
  CANONICAL_ASSET_NAME: requete-conseil-constitutionnel-haute-corse-2026.pdf

jobs:
  build-review-pdf:
    name: Build ephemeral REVIEW PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact source
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Install PDF toolchain
        id: toolchain
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sudo apt-get update
          update_code=$?
          if [ "$update_code" -eq 0 ]; then
            sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-fonts-recommended lmodern fonts-dejavu-core poppler-utils
            install_code=$?
          else
            install_code=125
          fi
          echo "update_code=$update_code" >> "$GITHUB_OUTPUT"
          echo "install_code=$install_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare REVIEW source
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          src = Path("research/senatoriales-2026/requete-conseil-constitutionnel.md")
          if not src.exists():
              print("prepare_error=canonical_source_missing", file=sys.stderr)
              raise SystemExit(20)

          text = src.read_text(encoding="utf-8")

          if text.startswith("---\n"):
              end = text.find("\n---\n", 4)
              if end != -1:
                  text = text[end + 5:]

          notice = "\n".join([
              "# BROUILLON DE REVUE - NON DEPOSE",
              "",
              "> **PDF REVIEW genere automatiquement depuis le chemin canonique de travail.**",
              "> Ce fichier n'est ni la version gelee, ni la preuve d'un depot.",
              "> Il est publie comme asset de build a l'URL canonique qui sera conservee lors du gel final.",
              "",
              "---",
              "",
          ])

          out = Path(os.environ["RUNNER_TEMP"]) / "requete-review.md"
          out.write_text(notice + text, encoding="utf-8")
          PY
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render PDF
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/cc-review"
          if [ ! -s "$RUNNER_TEMP/requete-review.md" ]; then
            code=30
          elif ! command -v pandoc >/dev/null 2>&1 || ! command -v xelatex >/dev/null 2>&1; then
            code=31
          else
            pandoc "$RUNNER_TEMP/requete-review.md" \
              --from=gfm \
              --pdf-engine=xelatex \
              -V lang=fr-FR \
              -V geometry:margin=22mm \
              -V fontsize=10.5pt \
              -V papersize=a4 \
              -V colorlinks=true \
              -V linkcolor=blue \
              -V urlcolor=blue \
              -o "$RUNNER_TEMP/cc-review/$CANONICAL_ASSET_NAME"
            code=$?
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify PDF structure and renderability
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          PDF="$RUNNER_TEMP/cc-review/$CANONICAL_ASSET_NAME"
          code=0

          if [ ! -s "$PDF" ]; then
            code=40
          elif ! head -c 5 "$PDF" | grep -q '%PDF-'; then
            code=41
          elif ! pdfinfo "$PDF" > "$RUNNER_TEMP/cc-review/PDFINFO.txt" 2>&1; then
            code=42
          else
            mkdir -p "$RUNNER_TEMP/render-check"
            if ! pdftoppm -f 1 -singlefile -png -r 120 "$PDF" "$RUNNER_TEMP/render-check/page-1" >/dev/null 2>&1; then
              code=43
            elif [ ! -s "$RUNNER_TEMP/render-check/page-1.png" ]; then
              code=44
            fi
          fi

          if [ "$code" -eq 0 ]; then
            sha256sum "$PDF" | tee "$RUNNER_TEMP/cc-review/SHA256SUMS.txt"
            printf '%s\n' "${{ github.sha }}" > "$RUNNER_TEMP/cc-review/SOURCE_COMMIT.txt"
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish canonical build asset
        id: publish
        if: always() && steps.verify.outputs.code == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PDF="$RUNNER_TEMP/cc-review/$CANONICAL_ASSET_NAME"

          if ! gh release view "$CANONICAL_RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$CANONICAL_RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "Sénatoriales Haute-Corse 2026 — PDF pré-gel" \
              --notes "Asset de build à URL canonique stable. Tant que le gel final n'est pas prononcé, son contenu est pré-gel et peut être remplacé. Le binaire n'est pas versionné dans Git."
          fi

          gh release delete-asset "$CANONICAL_RELEASE_TAG" "$CANONICAL_ASSET_NAME" --repo "${{ github.repository }}" --yes >/dev/null 2>&1 || true
          gh release upload "$CANONICAL_RELEASE_TAG" "$PDF#$CANONICAL_ASSET_NAME" --repo "${{ github.repository }}" --clobber

          echo "canonical_url=https://github.com/${{ github.repository }}/releases/download/$CANONICAL_RELEASE_TAG/$CANONICAL_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Write structured build result
        id: result
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cc-review"
          checkout="${{ steps.checkout.outcome }}"
          update_code="${{ steps.toolchain.outputs.update_code || 'not-run' }}"
          install_code="${{ steps.toolchain.outputs.install_code || 'not-run' }}"
          prepare_code="${{ steps.prepare.outputs.code || 'not-run' }}"
          render_code="${{ steps.render.outputs.code || 'not-run' }}"
          verify_code="${{ steps.verify.outputs.code || 'not-run' }}"
          publish_outcome="${{ steps.publish.outcome || 'not-run' }}"

          overall="success"
          if [ "$checkout" != "success" ] || [ "$install_code" != "0" ] || [ "$prepare_code" != "0" ] || [ "$render_code" != "0" ] || [ "$verify_code" != "0" ] || [ "$publish_outcome" != "success" ]; then
            overall="blocked"
          fi

          cat > "$RUNNER_TEMP/cc-review/BUILD_RESULT.json" <<EOF
          {
            "schema": "cc-review-build-result/v2",
            "overall": "$overall",
            "source_commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "canonical_url": "https://github.com/${{ github.repository }}/releases/download/$CANONICAL_RELEASE_TAG/$CANONICAL_ASSET_NAME",
            "asset_semantics": "build-asset-not-git-versioned",
            "codes": {
              "checkout": "$checkout",
              "apt_update": "$update_code",
              "toolchain_install": "$install_code",
              "prepare": "$prepare_code",
              "render": "$render_code",
              "verify": "$verify_code",
              "publish": "$publish_outcome"
            }
          }
          EOF

          echo "overall=$overall" >> "$GITHUB_OUTPUT"

          {
            echo "## CC petition REVIEW PDF"
            echo
            echo "- result: **$overall**"
            echo "- source commit: ${{ github.sha }}"
            echo "- canonical build asset: https://github.com/${{ github.repository }}/releases/download/$CANONICAL_RELEASE_TAG/$CANONICAL_ASSET_NAME"
            echo "- semantics: build asset / pre-gel / not versioned in Git"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived Actions artifact
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: requete-conseil-constitutionnel-REVIEW-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cc-review/${{ env.CANONICAL_ASSET_NAME }}
            ${{ runner.temp }}/cc-review/SHA256SUMS.txt
            ${{ runner.temp }}/cc-review/SOURCE_COMMIT.txt
            ${{ runner.temp }}/cc-review/PDFINFO.txt
            ${{ runner.temp }}/cc-review/BUILD_RESULT.json
          retention-days: 7
          if-no-files-found: warn

      - name: Publish durable success receipt
        if: always() && steps.result.outputs.overall == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/receipt.md" <<EOF
          ## CC petition REVIEW PDF — build complete

          - source commit: `${{ github.sha }}`
          - workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - canonical URL: https://github.com/${{ github.repository }}/releases/download/$CANONICAL_RELEASE_TAG/$CANONICAL_ASSET_NAME
          - semantics: REVIEW / pré-gel / asset de build / non versionné dans Git
          - Actions artifact retention: 7 days
          EOF
          gh issue comment 90 --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/receipt.md" || true

      - name: Preserve green workflow semantics
        if: always()
        shell: bash
        run: |
          echo "Workflow completed with structured result: ${{ steps.result.outputs.overall || 'unknown' }}"
          exit 0
