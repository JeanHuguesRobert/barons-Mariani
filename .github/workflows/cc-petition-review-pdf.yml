name: Conseil constitutionnel petition REVIEW PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/senatoriales-2026/requete-conseil-constitutionnel.md"
      - ".github/workflows/cc-petition-review-pdf.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: cc-petition-review-pdf
  cancel-in-progress: true

jobs:
  build-review-pdf:
    name: Build ephemeral REVIEW PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact source
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Install PDF toolchain
        id: toolchain
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sudo apt-get update
          update_code=$?
          if [ "$update_code" -eq 0 ]; then
            sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-fonts-recommended lmodern fonts-dejavu-core poppler-utils
            install_code=$?
          else
            install_code=125
          fi
          echo "update_code=$update_code" >> "$GITHUB_OUTPUT"
          echo "install_code=$install_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare REVIEW source
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          src = Path("research/senatoriales-2026/requete-conseil-constitutionnel.md")
          if not src.exists():
              print("prepare_error=canonical_source_missing", file=sys.stderr)
              raise SystemExit(20)

          text = src.read_text(encoding="utf-8")

          if text.startswith("---\n"):
              end = text.find("\n---\n", 4)
              if end != -1:
                  text = text[end + 5:]

          notice = "\n".join([
              "# BROUILLON DE REVUE - NON DEPOSE",
              "",
              "> **PDF REVIEW genere automatiquement depuis le chemin canonique de travail.**",
              "> Ce fichier n'est ni la version gelee, ni la preuve d'un depot, ni une GitHub Release.",
              "> Sa finalite est exclusivement la relecture et la transmission preparatoire.",
              "",
              "---",
              "",
          ])

          out = Path(os.environ["RUNNER_TEMP"]) / "requete-review.md"
          out.write_text(notice + text, encoding="utf-8")
          PY
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render PDF
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/cc-review"
          if [ ! -s "$RUNNER_TEMP/requete-review.md" ]; then
            code=30
          elif ! command -v pandoc >/dev/null 2>&1 || ! command -v xelatex >/dev/null 2>&1; then
            code=31
          else
            pandoc "$RUNNER_TEMP/requete-review.md" \
              --from=gfm \
              --pdf-engine=xelatex \
              -V lang=fr-FR \
              -V geometry:margin=22mm \
              -V fontsize=10.5pt \
              -V papersize=a4 \
              -V colorlinks=true \
              -V linkcolor=blue \
              -V urlcolor=blue \
              -o "$RUNNER_TEMP/cc-review/requete-conseil-constitutionnel-REVIEW.pdf"
            code=$?
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify PDF structure and renderability
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          PDF="$RUNNER_TEMP/cc-review/requete-conseil-constitutionnel-REVIEW.pdf"
          code=0

          if [ ! -s "$PDF" ]; then
            code=40
          elif ! head -c 5 "$PDF" | grep -q '%PDF-'; then
            code=41
          elif ! pdfinfo "$PDF" > "$RUNNER_TEMP/cc-review/PDFINFO.txt" 2>&1; then
            code=42
          else
            mkdir -p "$RUNNER_TEMP/render-check"
            if ! pdftoppm -f 1 -singlefile -png -r 120 "$PDF" "$RUNNER_TEMP/render-check/page-1" >/dev/null 2>&1; then
              code=43
            elif [ ! -s "$RUNNER_TEMP/render-check/page-1.png" ]; then
              code=44
            fi
          fi

          if [ "$code" -eq 0 ]; then
            sha256sum "$PDF" | tee "$RUNNER_TEMP/cc-review/SHA256SUMS.txt"
            printf '%s\n' "${{ github.sha }}" > "$RUNNER_TEMP/cc-review/SOURCE_COMMIT.txt"
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish durable commit-addressed REVIEW PDF
        id: publish_review
        if: always() && steps.verify.outputs.code == '0'
        continue-on-error: true
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PDF="$RUNNER_TEMP/cc-review/requete-conseil-constitutionnel-REVIEW.pdf"
          SUMS="$RUNNER_TEMP/cc-review/SHA256SUMS.txt"
          SRC="$RUNNER_TEMP/cc-review/SOURCE_COMMIT.txt"

          TARGET_DIR="research/senatoriales-2026/review-pdf/$SOURCE_SHA"
          TARGET_PDF="$TARGET_DIR/requete-conseil-constitutionnel-REVIEW.pdf"

          if [ ! -s "$PDF" ] || [ ! -s "$SUMS" ] || [ ! -s "$SRC" ]; then
            echo "Required REVIEW outputs are missing." >&2
            exit 50
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish onto the current main tip, while preserving the exact
          # source commit in the directory name. This avoids stale push
          # failures when main advanced during the PDF build.
          git fetch origin main
          git reset --hard origin/main

          mkdir -p "$TARGET_DIR"
          cp "$PDF" "$TARGET_PDF"
          cp "$SUMS" "$TARGET_DIR/SHA256SUMS.txt"
          cp "$SRC" "$TARGET_DIR/SOURCE_COMMIT.txt"

          cat > "$TARGET_DIR/README.md" <<EOF
          # REVIEW PDF — source $SOURCE_SHA

          This directory is a durable, commit-addressed review snapshot.

          - source commit: `$SOURCE_SHA`
          - status: **REVIEW — non déposé — non gelé**
          - PDF: `requete-conseil-constitutionnel-REVIEW.pdf`
          - integrity: `SHA256SUMS.txt`

          This snapshot must never be confused with the future frozen/final filing artifact.
          EOF

          git add "$TARGET_DIR"

          if git diff --cached --quiet; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            git commit -m "senatoriales: publish REVIEW PDF for $SOURCE_SHA"
            # One retry handles a concurrent main update without changing the
            # source-addressed payload.
            if ! git push origin HEAD:main; then
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

          echo "review_path=$TARGET_PDF" >> "$GITHUB_OUTPUT"
          echo "review_url=https://github.com/${{ github.repository }}/blob/main/$TARGET_PDF" >> "$GITHUB_OUTPUT"
          echo "raw_url=https://raw.githubusercontent.com/${{ github.repository }}/main/$TARGET_PDF" >> "$GITHUB_OUTPUT"

      - name: Write structured build result
        id: result
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cc-review"
          checkout="${{ steps.checkout.outcome }}"
          update_code="${{ steps.toolchain.outputs.update_code || 'not-run' }}"
          install_code="${{ steps.toolchain.outputs.install_code || 'not-run' }}"
          prepare_code="${{ steps.prepare.outputs.code || 'not-run' }}"
          render_code="${{ steps.render.outputs.code || 'not-run' }}"
          verify_code="${{ steps.verify.outputs.code || 'not-run' }}"

          overall="success"
          if [ "$checkout" != "success" ] || [ "$install_code" != "0" ] || [ "$prepare_code" != "0" ] || [ "$render_code" != "0" ] || [ "$verify_code" != "0" ]; then
            overall="blocked"
          fi

          cat > "$RUNNER_TEMP/cc-review/BUILD_RESULT.json" <<EOF
          {
            "schema": "cc-review-build-result/v1",
            "overall": "$overall",
            "source_commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "codes": {
              "checkout": "$checkout",
              "apt_update": "$update_code",
              "toolchain_install": "$install_code",
              "prepare": "$prepare_code",
              "render": "$render_code",
              "verify": "$verify_code"
            }
          }
          EOF

          echo "overall=$overall" >> "$GITHUB_OUTPUT"

          {
            echo "## CC petition REVIEW PDF"
            echo
            echo "- result: **$overall**"
            echo "- source commit: ${{ github.sha }}"
            echo "- checkout: $checkout"
            echo "- apt update: $update_code"
            echo "- toolchain install: $install_code"
            echo "- prepare: $prepare_code"
            echo "- render: $render_code"
            echo "- verify: $verify_code"
            if [ "$verify_code" = "0" ]; then
              echo "- durable review: https://github.com/${{ github.repository }}/blob/main/research/senatoriales-2026/review-pdf/${{ github.sha }}/requete-conseil-constitutionnel-REVIEW.pdf"
              echo "- raw PDF: https://raw.githubusercontent.com/${{ github.repository }}/main/research/senatoriales-2026/review-pdf/${{ github.sha }}/requete-conseil-constitutionnel-REVIEW.pdf"
            fi
            echo
            echo "A blocked REVIEW build is a structured result, not a GitHub Actions failure."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload REVIEW result artifact
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: requete-conseil-constitutionnel-REVIEW-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cc-review/requete-conseil-constitutionnel-REVIEW.pdf
            ${{ runner.temp }}/cc-review/SHA256SUMS.txt
            ${{ runner.temp }}/cc-review/SOURCE_COMMIT.txt
            ${{ runner.temp }}/cc-review/PDFINFO.txt
            ${{ runner.temp }}/cc-review/BUILD_RESULT.json
          retention-days: 7
          if-no-files-found: warn

      - name: Publish durable success receipt
        if: always() && steps.result.outputs.overall == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/receipt.md" <<'EOF'
          ## CC petition REVIEW PDF — build complete

          - source commit: `${{ github.sha }}`
          - workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - run id: `${{ github.run_id }}`
          - artifact: `requete-conseil-constitutionnel-REVIEW-${{ github.sha }}`
          - durable REVIEW PDF: https://github.com/${{ github.repository }}/blob/main/research/senatoriales-2026/review-pdf/${{ github.sha }}/requete-conseil-constitutionnel-REVIEW.pdf
          - raw PDF: https://raw.githubusercontent.com/${{ github.repository }}/main/research/senatoriales-2026/review-pdf/${{ github.sha }}/requete-conseil-constitutionnel-REVIEW.pdf
          - semantics: REVIEW / non déposé / non gelé / durable snapshot / non publié comme Release
          - Actions artifact retention: 7 days
          EOF
          gh issue comment 90 --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/receipt.md" || true

      - name: Preserve green workflow semantics
        if: always()
        shell: bash
        run: |
          echo "Workflow completed with structured result: ${{ steps.result.outputs.overall || 'unknown' }}"
          exit 0
