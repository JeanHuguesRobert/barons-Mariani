name: SEN 2026-6589 document composition receipt
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sen-2026-6589-preview.yml'
      - 'scripts/sen-2026-6589-build.py'
      - 'scripts/sen-2026-6589-ubikia-preview.sh'
      - 'research/senatoriales-2026/complement-2026-6589-sen/**'
      - 'research/senatoriales-2026/qpc/memoire-qpc-l299-formalisme-candidature-empechement-remplacant.md'
      - 'research/senatoriales-2026/qpc/memoire-qpc-l303-garanties-juridictionnelles.md'
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JeanHuguesRobert/Ubikia
          ref: main
          path: ubikia
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ubikia/package-lock.json
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: Install Ubikia dependencies
        working-directory: ubikia
        run: npm ci
      - name: Supervised composition and source checks
        id: composition
        shell: bash
        run: |
          mkdir -p sen-result
          python3 - <<'PY'
          import json, pathlib, subprocess, traceback
          out = pathlib.Path('sen-result')
          command = ['python3','scripts/sen-2026-6589-build.py','--compose-only','--out','/tmp/sen-2026-6589-ci']
          result = {'phase':'composition','status':'unknown','command':command}
          try:
              p = subprocess.run(command, text=True, capture_output=True, timeout=120)
              (out/'execution.log').write_text(p.stdout + '\n---stderr---\n' + p.stderr, encoding='utf-8')
              result['returncode'] = p.returncode
              generated = pathlib.Path('/tmp/sen-2026-6589-ci/complement-integral.preview.md')
              result['generated'] = generated.is_file()
              if generated.is_file():
                  text = generated.read_text(encoding='utf-8')
                  result['qpc_heading_count'] = text.count('MÉMOIRE DISTINCT ET MOTIVÉ')
                  result['bytes'] = generated.stat().st_size
                  (out/'complement-integral.preview.md').write_text(text, encoding='utf-8')
              result['status'] = 'passed' if p.returncode == 0 and result.get('qpc_heading_count',0) >= 2 else 'failed'
              result['filing_ready'] = False
              result['filing_blockers'] = ['editorial-review-outstanding', 'draft-instructions-in-source', 'render-and-attachment-audit-outstanding']
              manifest = pathlib.Path('/tmp/sen-2026-6589-ci/composition.preview.json')
              if manifest.is_file():
                  (out/'composition.preview.json').write_bytes(manifest.read_bytes())
                  try:
                      json.loads(manifest.read_text(encoding='utf-8'))
                      result['source_manifest_json_valid'] = True
                  except ValueError as exc:
                      result['source_manifest_json_valid'] = False
                      result['status'] = 'failed'
                      result['manifest_error'] = str(exc)
          except Exception:
              result['status'] = 'failed'
              (out/'execution.log').write_text(traceback.format_exc(), encoding='utf-8')
          result.setdefault('filing_ready', False)
          (out/'result.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Render reproducible PDF and text previews
        if: steps.composition.outcome == 'success'
        id: render
        env:
          UBIKIA_DIR: ${{ github.workspace }}/ubikia
          SEN_PREVIEW_STAGE: ${{ runner.temp }}/sen-2026-6589-preview
        run: bash scripts/sen-2026-6589-ubikia-preview.sh
      - name: Record separate composition, build, and filing states
        if: always()
        env:
          COMPOSITION_OUTCOME: ${{ steps.composition.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          result_path = pathlib.Path('sen-result/result.json')
          result = json.loads(result_path.read_text(encoding='utf-8')) if result_path.is_file() else {}
          result['composition_outcome'] = os.environ.get('COMPOSITION_OUTCOME', 'unknown')
          result['render_outcome'] = os.environ.get('RENDER_OUTCOME', 'unknown')
          result['build_status'] = 'passed' if result['composition_outcome'] == 'success' and result['render_outcome'] == 'success' else 'failed'
          result['filing_ready'] = False
          preview = pathlib.Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'sen-2026-6589-preview'
          manifest = preview / 'delivery-preview-manifest.json'
          if manifest.is_file():
              shutil.copy2(manifest, pathlib.Path('sen-result/delivery-preview-manifest.json'))
              result['delivery_preview_manifest'] = 'delivery-preview-manifest.json'
          result_path.parent.mkdir(parents=True, exist_ok=True)
          result_path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Upload build outputs and receipt regardless of render outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sen-2026-6589-build-preview
          path: |
            sen-result/
            ${{ runner.temp }}/sen-2026-6589-preview/
          if-no-files-found: warn
          retention-days: 14
