name: Bootstrap CC pre-freeze build asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cc-petition-bootstrap-canonical-asset.yml"

permissions:
  contents: write

jobs:
  promote-existing-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote existing REVIEW PDF to immutable build release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: senatoriales-2026-cc-build-66f34d0cb32e94509988b6f83a87c8a215b3fb81
          SOURCE: research/senatoriales-2026/review-pdf/66f34d0cb32e94509988b6f83a87c8a215b3fb81/requete-conseil-constitutionnel-REVIEW.pdf
          ASSET: requete-conseil-constitutionnel-haute-corse-2026.pdf
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOURCE"
          cp "$SOURCE" "$RUNNER_TEMP/$ASSET"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Build release already exists: $TAG"
            exit 0
          fi

          # Immutable Releases require assets to be attached at creation time.
          gh release create "$TAG" "$RUNNER_TEMP/$ASSET#$ASSET" \
            --repo "${{ github.repository }}" \
            --target "66f34d0cb32e94509988b6f83a87c8a215b3fb81" \
            --prerelease \
            --title "Sénatoriales Haute-Corse 2026 — build pré-gel 66f34d0c" \
            --notes "Asset de build pré-gel. Le PDF est conservé comme asset de Release et n'a pas vocation à être versionné dans Git."

          echo "Build asset URL:"
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET"
