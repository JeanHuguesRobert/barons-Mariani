    artistic_status: established
    date:
      earliest: '2021-04-17'
      latest: '2021-04-26'
      precision: exact-range
    places: [Saint-Laurent-le-Minier, Gard]
    creators: [Marie-Louise Robert]
    collaborators: [Hugues Absil]
    description_factual: Marie-Louise est attestée comme participant à une résidence artistique pour un tournage aux Falguières, à Saint-Laurent-le-Minier, du 17 au 26 avril 2021, dans le cadre d'une embauche documentée par l'artiste plasticien Hugues Absil.
    existence_status: established
    access_status: trace-only
    evidence:
      - evidence_type: C
        epistemic_status: TRACE
        source_type: SOURCE-GMAIL
        source_ref: Gmail:178df4383f1868a0
        description: Attestation d'embauche du 14 avril 2021, pièce jointe attestation.pdf, indiquant explicitement « résidence artistique » et « tournage ».
    certainty: high
    related_entries: [MLR-000011]
    witnesses:
      - name: Hugues Absil
        role: artiste plasticien / employeur attestant la résidence et le tournage
      - name: Anna
        role: personne mentionnée dans le fil comme ayant fourni l'attestation; identité à préciser
    privacy:
      visibility: public-summary-only
      contains_private_material: true
      publication_note: Publier le fait artistique et les références de source sans exposer les coordonnées privées présentes dans l'attestation.
    open_questions:
      - Quel était le titre, le sujet et le statut du tournage ?
      - Quel rôle précis Marie-Louise y tenait-elle ?
      - Existe-t-il un film, rushes, photographies, générique, dossier de résidence ou autres participants identifiables ?
      - Cette résidence a-t-elle un lien quelconque avec l'intervention ZAD dans le Sud ? Ne pas les confondre sans preuve.
    next_probes:
      - Rechercher Hugues Absil, Falguières, Saint-Laurent-le-Minier, tournage et résidence dans les autres sources du Corpus.
      - Identifier Anna et les autres participants.
      - Rechercher fichiers audiovisuels et photographies datés du 17 au 26 avril 2021.

