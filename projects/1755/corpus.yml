  rule: "Le Livre Vivant 1755 est un dossier probatoire ouvert et une surface éditoriale vivante. Il ne revendique pas un monopole mémoriel mais instruit l'hypothèse de la contribution corse au constitutionnalisme démocratique moderne sous contrainte scientifique stricte."

realities:
  - id: distinction-histoire-et-mythe
    status: active
    statement: "Séparation stricte entre faits historiques documentés (Level A : Consulte de Corte, Constitution écrite de 1755, Dieta, Boswell, Rousseau), vérifications archivistiques requises (Level A/B : manuscrit original, cote, conservation) et interprétations historiographiques (Level B : précocité démocratique, séparation des pouvoirs, droit écrit transformateur)."
  - id: amont-communs-et-nobles-douze
    status: active
    statement: "La rupture constitutionnelle de 1755 prend racine dans la faillite de la médiation corporatiste génoise des Nobles Douze (1571-1729) et la crise de régulation de la Terra di Comune (documentée dans le Livre Vivant Commons)."
  - id: non-nationalisme-et-universalisme
    status: active
    statement: "Le Projet 1755 n'est pas un plaidoyer nationaliste ou une revendication d'exception insulaire ; c'est un examen historiographique transnational portant sur la circulation européenne et atlantique des formes démocratiques."
  - id: double-temporality
    status: active
    statement: "Tenue rigoureuse de la double temporalité : l'histoire du XVIIIe siècle repose sur des pièces primaires et secondaires vérifiées ; les résonances contemporaines (Autonomie de Capacité, Kudocracy) sont explicitement typées comme hypothèses prospectives."

