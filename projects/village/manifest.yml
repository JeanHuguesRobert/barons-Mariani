schema: living-book/v1

book:
  id: village
  title: Mariani Village
  subtitle: Habitat minimaliste autonome, réseau DC-native, déclinaisons Séniors et Van life
  canonical_host: village.acorsica.org
  language: fr
  description: >
    Livre Vivant documentant l'architecture de flotte d'habitat minimaliste autonome Mariani Village,
    ses fondations énergétiques DC-native (48V SELV), sa péréquation saisonnière solidaire,
    et ses deux évolutions majeures : l'habitat adapté aux aînés (version Séniors) et l'autonomie nomade (version Van life).

