realities:
  - id: name-collision
    status: open
    statement: "The name PrivAI already names an initiative and a privacy protocol. The Living Book is a later editorial projection of that lineage, not a new organization and not a certification."
  - id: legal-carriage
    status: consolidated
    statement: "PrivAI is developed in the prefiguration perimeter of Institut Mariani (R&D emanation of C.O.R.S.I.C.A.) without commercial carriage or person confusion, preparing a future independent PrivAI Foundation."
  - id: public-host
    status: prepared
    statement: "On 2026-10-04 the name privai.acorsica.org did not resolve. Deployment architecture is documented in projects/privai/deploy/README.md (Cloudflare CNAME to fracta.fractavolta.com -> Fracta2 origin). DNS and server activation stay with Operium."
  - id: guide-profile
    status: specified
    statement: "Guide profile is formally specified in projects/privai/guide-profile.yml and wired in site/guide.html and site/guide.js. Backend registration on cogentia.fractavolta.com remains to be loaded."
  - id: certification
    status: absent
    statement: "No PrivAI certification is claimed. Cogentia is a candidate implementation and does not self-certify, per acorsica/privai."

