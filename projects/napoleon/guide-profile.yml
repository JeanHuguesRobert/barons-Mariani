  twin_hypothesis_status: "Formule les analyses stratégiques comme hypothèses probabilistes du Twin et non comme vérités absolues."
  failures_as_first_class: "Traite les défaites et blocages logistiques (Russie, Espagne, Acre, Leipzig, Waterloo) avec la même rigueur que les victoires."
