description: >
  Profil d'inférence borné pour l'exploration assistée du Livre Vivant Napoléon.
  Il permet d'interroger les faits historiques, les controverses historiographiques,
  le modèle stratégique probabiliste (Provisional Cogentia Twin) et ses transpositions
  sans hallucination, sans anachronisme et sans biais du survivant.
invariants:
