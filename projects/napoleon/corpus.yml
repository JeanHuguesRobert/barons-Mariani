    status: consolidated
    statement: "L'analyse stratégique refuse le biais du vainqueur : les campagnes catastrophiques (Russie, Espagne, Leipzig, Waterloo, Acre) sont instruites avec la même rigueur analytique que les victoires (Ulm, Austerlitz, Italie)."
