editorial_ethics:
  baseline:
    - "SNJ Charter of Professional Ethics 1918/1938/2011"
    - "Munich Declaration of the Duties and Rights of Journalists 1971"
  extensions:
    - "explicit epistemic statuses"
    - "versioned provenance"
    - "visible UNKNOWN"
    - "conditions of revision"
    - "Disclosure Gate"
    - "versioned corrections"
    - "AI contribution traceability"
  dramatic_title_does_not_license_dramatic_factual_claims: true

scale_parallelism:
  required: true
  individual:
    reality_case: "Marie-Louise"
    allowed_objects:
      - capacities
      - openings
      - frictions
      - loads
      - local closures
      - reopenings
      - routes
      - perceived possibilities when directly sourced
  collective:
    reality_case: "Corsica and its inhabitants"
    allowed_objects:
      - distributed capacities
      - institutional and infrastructural conversion factors
      - routes and alternatives
      - dependencies
      - delays
      - access
      - concentration
      - capture
      - resilience
  invariance_rule: >
    Transfer only relations that survive the change of scale without changing
    meaning; always record what does not transpose.
  forbidden_transfer:
    - despair
    - entrapment as collective psychology
    - desire to live or die
    - cognitive constriction as a territorial mental state

political_documentation:
  status: "documentary context, not electoral recommendation"
  current_landscape_update: "../../../research/autonomia/recomposition_droites_identitaires_corse_2026-09-20.md"
  community_arc: "Communauté de destin → communauté de transmission → communauté en déclin ?"
  settler_colonialism_question:
    status: "hypothesis/question to test; not an acquired characterization of contemporary Corsica"
    required_distinctions:
      - "state policy"
      - "ordinary migration"
      - "market and attractiveness effects"
      - "land and housing"
      - "language and transmission"
      - "integration capacity"
      - "power asymmetries"
      - "intent versus effect"
  documented_horizon:
    label: "Une Corse capable"
    sources:
      - ../../research/autonomia.md
      - ../../research/democratie_capable.md
      - ../../research/trails/une_corse_capable.md
      - ../../research/senatoriales-2026/declaration_continuite_electorale_2026-09-17.md
  electoral_genealogy_candidate:
    rule: "Separate documented traces, dated declarations and retrospective interpretation."
    milestones:
      - period: "2010–2011"
        object: "transparency, corrigibility and SimpliWiki"
        status: "documentary genealogy candidate"
      - period: "2014–2016"
        object: "Kudocracy, liquid democracy, public/reversible voting and decision traces"
        status: "documented technical-democratic lineage"
      - period: "2017"
        object: "explicit electoral Reality Test"
        status: "documented election participation"
      - period: "2020–2026"
        object: "subsequent electoral continuities and A Voce / Le Petit Parti relationships"
        status: "documented with varying source strength"
      - period: "2026"
        object: "Autonomie de Capacité / Une Corse capable"
        status: "documented doctrine and dated electoral presentation"
      - period: "2027"
        object: "presidential participation"
        status: "declared intention only"
  national_projection_candidate:
    name: "France Capable"
    status: "candidate label introduced for future exploration"
    not_yet:
      - "canonical doctrine"
      - "registered political party"
      - "registered presidential candidacy"
    requirement: "Create a dedicated dated source before treating the label as stabilized Corpus state."

editorial_plan:
  - id: A
    title: "La Machine à Empêcher"
    function: >
      Introduce the candidate mechanism at individual and collective scales,
      while preserving counterexamples and non-closures.
    individual_material:
      - "Marie-Louise: frictions, loads, local closures, reopenings"
    collective_material:
      - "Corsica: nominal capacities, dependencies, procedures, capture points"

  - id: B
    title: "Ne pas fermer la Carte"
    function: >
      Show that the first response to blockage is epistemic: preserve
      contradictions, alternatives and UNKNOWN instead of manufacturing closure.
    candidate_material:
      - "Marie-Louise identities/accounts/names"
      - "Nantes 2017 contradictory contemporary accounts"
      - "summer 2024 UNKNOWN"
      - "competing maps of Corsican futures"

  - id: C
    title: "La Machine à Explorer"
    function: >
      Search alternative routes, interlocutors, rules, infrastructures and
      bounded experiments at both scales.
    source_candidates:
      - ../../memory/marie-louise/2024_portes_et_controles_epistemiques.md
      - ../../research/second_method.md
      - ../../research/rational_odysseys_the_possible.md

  - id: D
    title: "Du possible à la capacité effective"
    function: >
      Distinguish resources, conversion factors, effective capabilities,
      accessible actions, buffers, routes, time and exit.
    source_candidates:
      - ../../research/potentics.md
      - ../../research/noyau_doctrinal_rendre_capable.md

  - id: E
    title: "Machine à Rendre Capable"
    function: >
      Test whether identified possibilities can be converted into effective
      action without merely transferring dependency elsewhere.
    collective_horizon: "Une Corse capable"

  - id: F
    title: "Reality Tests"
    function: >
      Use works, studies, elections, procedures and public Acts as tests that
      may confirm, bound or falsify parts of the model.
    candidate_cases:
      - "Marie-Louise artistic and educational trajectory"
      - "elections 2017–2024"
      - "2022→2024 ballot material continuity"
      - "Corsican autonomy process"
      - "senatorial procedure 2026"
      - "Project #1755 and other bounded Acts"

  - id: G
    title: "Changer d'échelle sans tricher"
    function: >
      Compare relations across individual and collective scales, with an
      explicit row for non-invariants and a prohibition on collective psychology.

  - id: H
    title: "Du laboratoire corse à l'échelle nationale"
    function: >
      Document the already-established 'Une Corse capable' horizon and expose
      'France Capable' only as a candidate national projection requiring its
      own future source and Reality Tests.

  - id: I
    title: "Le Réel répond"
    function: >
      Record successes, failures, refusals, silences, contradictions, witness
      input, abandoned hypotheses and other Reality responses.

  - id: J
    title: "Journal de campagne contre l'impossible"
    function: >
      Human-readable delta of what the Corpus learned, corrected, opened,
      abandoned and deferred since the frozen anniversary edition.
    contract: journal-weekly.yml

