  status: "structural hypothesis tested by Reality Cases, not imposed causal explanation"
  formula: >
    Detect configurations that reduce effective capacity; keep the Map open
    by exploring alternatives and objections; identify factors of conversion;
    then test whether effective capacity is actually restored or created.

