realities:
  - id: distinction-cogentia-commons
    status: verified
    statement: "Commons is a broad Living Book exploring the history, present, and possible futures of commons across all substrates (communaux, water, forests, open source, knowledge, data, energy, compute, cognition). Cogentia Commons is a specific candidate modern case — a cognitive commons / epistemic exploration platform under scientific constraint."
  - id: double-temporality
    status: active
    statement: "A Janus-faced double temporality is strictly maintained: historical claims require established empirical sources and primary/secondary documentation; prospective claims are explicitly marked as scenarios, hypotheses, and Reality Tests."
  - id: rivalry-and-goods-distinction
    status: active
    statement: "No silent equivalence between historical common-pool resources (rival, depletable, natural) and digital commons (non-rival, cumulative, artificially excludable). Substrate shifts change the governance equations."
  - id: public-host
    status: absent
    statement: "On 2026-10-04 the name commons.acorsica.org did not resolve from this workstation. No DNS or server change was made."
  - id: sovereignty-boundary
    status: active
    statement: "Not everything that can be shared should be pooled. Personal sovereignty, private spheres, dissent, and exit rights must be preserved against institutional over-communalization."

