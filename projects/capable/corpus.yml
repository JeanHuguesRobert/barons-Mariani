realities:
  - id: name-definition
    status: consolidated
    statement: "Capable est un adjectif qualifiant les propriétés d'un système (possibles ouverts, accessibles, exerçables, observables, corrigibles) et non un verdict moral sur les personnes."
  - id: institutional-carriage
    status: consolidated
    statement: "Capable s'articule à trois niveaux : C.O.R.S.I.C.A. (matrice associative 1995), Capable (mouvement civique et politique transversal), et Le Petit Parti (véhicule pratique de participation électorale)."
  - id: silence-rule
    status: consolidated
    statement: "Une absence de réponse ne transforme jamais automatiquement UNKNOWN ou PENDING en ESTABLISHED. Aucun état n'est dérivé d'un silence administratif comme s'il s'agissait d'une preuve négative."
  - id: public-host
    status: prepared
    statement: "Domaine public cible : capable.lepp.fr. Déploiement statique autonome sans modification DNS ou serveur non autorisée."

