      confidence: medium
      notes: >
        SAGE vs StarX25. DOS/DESQview base + CMIP testimony 2026-07-26.
        Unix line: sage_x. Full write-up: perform note §4.1d.

  - id: sage_x
    label: "SAGE/X — port Unix de SAGE"
    period: "mid_1990s"
    role: "version de SAGE tournant sous Unix ; /X = Unix (pas X.25)"
    function: "porter le management system sur plateformes Unix (pression NMS type OpenView)"
    product_kind: management_system_unix
    slash_x_means: Unix
    platforms:
      - Unix (generic mid-1990s)
      - IBM AIX on RS/6000 (port ; plateforme dispo dès 1990)
    market_context:
      - "OpenView already established ~1990 (IBM licensed HP NNM/OpenView tech 1990)"
      - "mid-1990s = competitive heyday of Unix NMS (OpenView vs SunNet Manager), not first OpenView launch"
    capacities:
      - unix_runtime
      - network_management_system
      - multi_unix_portability
      - aix_port
    evidence:
      status: personal_memory
      confidence: medium
      notes: >
        /X = Unix, ~mid-1990s (Perform memory). External check 2026-07-26:
        do not claim OpenView "released" mid-90s; RS/6000+AIX from Feb 1990.
        See perform note §4.1b verification table.

