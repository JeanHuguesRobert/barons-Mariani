      Objet : 2026-6589 SEN — Note de provenance et communication intégrale des deux mémoires QPC

      Madame, Monsieur,

      En réponse à votre demande du 7 octobre 2026 de communication « dans les plus brefs délais »,
      la présente communication fournit directement en texte intégral les deux mémoires distincts
      et motivés soulevés dans la requête relative aux élections sénatoriales de Haute-Corse.

      Le dossier documentaire de la démarche est publiquement consultable :
      https://github.com/JeanHuguesRobert/barons-Mariani

      La transmission de la vidéo P-13 et de la copie intégrale du présent texte par TransfertPro
      fera l'objet d'une indication distincte après vérification effective du dépôt. La présente
      version de travail n'affirme aucun dépôt non constaté.

